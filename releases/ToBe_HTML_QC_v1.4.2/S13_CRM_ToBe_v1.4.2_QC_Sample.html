<style>

/* ── Design system token block ── */
:root {
  /* === Spacing — base-2 scale === */
  --ds-space-01: 2px;
  --ds-space-02: 4px;
  --ds-space-03: 8px;
  --ds-space-04: 16px;
  --ds-space-05: 24px;
  --ds-space-06: 32px;
  --ds-space-07: 40px;
  --ds-space-08: 48px;
  --ds-space-09: 64px;
  --ds-space-10: 80px;
  --ds-space-11: 96px;
  --ds-space-12: 160px;

  /* === Type === */
  --ds-font-sans: Arial, Helvetica, sans-serif;

  /* === Primary colors === */
  --ds-color-company-red:       #CC0000;
  --ds-color-company-red-hover: #9D1B22;
  --ds-color-black:             #121212;
  --ds-color-white:             #FFFFFF;

  /* === Text colors === */
  --ds-text-black:    #000000;
  --ds-text-dark:     #333333;
  --ds-text-regular:  #717171;
  --ds-text-body:     #616568;   /* color-card hex labels, secondary body */
  --ds-text-helper:   #767676;   /* small-label helper text */
  --ds-text-on-color: #FFFFFF;

  /* === Neutral greys === */
  --ds-gray-x-light:  #F9F9F9;   /* default input fill, subtle layer */
  --ds-gray-light:    #ECECEC;   /* pill button border, dividers on tinted surfaces */
  --ds-gray-medium:   #CCCCCC;
  --ds-gray-dark:     #A3A3A3;
  --ds-stroke:        #D8D8D8;   /* canonical card/divider stroke */

  /* === Status / notification === */
  --ds-success:       #07C29F;
  --ds-success-light: #DAF2ED;
  --ds-warning:       #F1C21B;
  --ds-warning-light: #FEF7E8;
  --ds-error:         #CC0000;   /* same hue as company red — pair with icon/label, never color alone */
  --ds-error-light:   #F2DFD8;

  /* === Surfaces & layers === */
  --ds-background:        var(--ds-color-white);
  --ds-background-hover:  rgba(0, 0, 0, 0.04);
  --ds-layer-tinted:      var(--ds-gray-x-light);

  /* === Card shadow (signature) === */
  --ds-shadow-card: 0 14px 42px 0 rgba(8, 15, 52, 0.06);

  /* === Layout offsets ===
     Overridden locally when the artifact includes a top navigation bar
     (e.g. set --ds-nav-height: 64px on :root). Used by the progress-bar
     recipe to sit directly below the nav. */
  --ds-nav-height: 0;

  /* === Data-viz palette ===
     For palette decisions, see references/charts.md. */

  /* Company red — monochrome ramp (4 shades, light → dark) */
  --ds-red-100: #FF6666;     /* ⚠️ Ramp-only — never standalone. See Color exception rules. */
  --ds-red-200: #CC0000;   /* Company red — the HIGHLIGHT shade */
  --ds-red-300: #990000;
  --ds-red-400: #660000;

  /* Beacon Violet — used in multi-series + diverging */
  --ds-violet-100: #D5D6FF;   /* lightest lilac — common context/neutral series fill */
  --ds-violet-200: #988FEC;
  --ds-violet-300: #5E4ADC;   /* Beacon brand violet */

  /* Expert Purple — anchors the dark end of diverging scales */
  --ds-purple-100: #B4A2CB;
  --ds-purple-200: #926F98;
  --ds-purple-300: #4F0731;   /* Expert purple */

  /* "Something to highlight" grey ramp (5 steps, light → dark) */
  --ds-chart-gray-100: #D2D2D1;   /* lightest — default context fill on highlight charts */
  --ds-chart-gray-200: #A5A5A4;
  --ds-chart-gray-300: #777776;
  --ds-chart-gray-400: #343432;
  --ds-chart-gray-500: #000000;

  /* Soft warm greys — RESERVED for "Other" segments and accent backgrounds */
  --ds-other-100: #F2EEE9;
  --ds-other-200: #DCD1C9;
  --ds-other-300: #C6B3A8;

  /* Diverging scale (Negative → Neutral → Positive), 7 steps.
     ⚠️ Spectrum visualizations only — never as general series colors.
     See Color exception rules. */
  --ds-diverging-1: #4F0731;   /* Negative 1 — most negative (Expert purple) */
  --ds-diverging-2: #7C4C76;
  --ds-diverging-3: #A891BA;
  --ds-diverging-4: #D5D6FF;   /* Neutral (lilac) */
  --ds-diverging-5: #DDABD3;
  --ds-diverging-6: #DD476D;
  --ds-diverging-7: #FF0024;   /* Positive 1 — most positive */

  /* === Exception color (opt-in only — see references/charts.md) === */
  --ds-nps-red:        #CC0000;
  --ds-nps-gray:       #979797;
  --ds-nps-yellow:     #FFCC00;

  /* === Surface modes === (see references/advanced-color.md for Expert Purple) */

  /* Light mode (default) */
  --ds-surface:           var(--ds-color-white);
  --ds-surface-text:      var(--ds-text-dark);
  --ds-surface-heading:   var(--ds-text-black);
  --ds-surface-divider:   var(--ds-stroke);
  --ds-surface-eyebrow:   var(--ds-color-company-red);
}

/* Expert Purple surface mode — opt in by setting data-surface="purple" on <body>. */
[data-surface="purple"] {
  --ds-surface:         #4F0731;
  --ds-surface-text:    var(--ds-color-white);
  --ds-surface-heading: var(--ds-color-white);
  --ds-surface-divider: rgba(255, 255, 255, 0.15);
  --ds-surface-eyebrow: var(--ds-color-white);
  /* Consume the surface tokens here too — not only on html, body — so a region
     works when data-surface="purple" is scoped to an inner element (e.g. a single
     hero section on an otherwise white page), not just when it's on <body>. */
  color: var(--ds-surface-text);
  background: var(--ds-surface);
}

/* Apply base typography and surface tokens to the page. */
html, body {
  font-family: var(--ds-font-sans);
  color: var(--ds-surface-text);
  background: var(--ds-surface);
  margin: 0;
  font-size: 18px;
  line-height: 28px;
}

/* ── 이 프로세스맵 전용 의미 토큰: 전부 --ds-* 토큰에서 가져옴. 회사 레드는 포인트로만, 바탕은 흰색·웜그레이 ── */
:root{--lbw:300px;

--lane-alt:var(--ds-gray-x-light);--stage-alt:rgba(8,15,52,.012);
--t-ai:var(--ds-color-company-red);
--h-bg:var(--ds-color-white);--h-bd:var(--ds-stroke);--h-ac:var(--ds-gray-dark);
--nh-bg:var(--ds-other-100);--nh-bd:var(--ds-other-200);--nh-ac:var(--ds-other-300);
--a-bg:var(--ds-color-white);--a-bd:var(--ds-stroke);--a-ac:var(--ds-color-company-red);--na-bg:var(--ds-color-white);--na-bd:var(--ds-color-company-red);
--adv-bg:var(--ds-color-white);--adv-bd:var(--ds-stroke);--adv-ac:var(--ds-color-company-red);--gone-bd:var(--ds-gray-medium);--gone-ink:var(--ds-gray-dark);
--mk-bg:var(--ds-text-dark);--mk-ink:var(--ds-text-on-color);--mk-ac:var(--ds-color-company-red);
--e-def:var(--ds-gray-dark);--e-ai:var(--ds-color-company-red);--e-hitl:var(--ds-other-300);--e-rej:var(--ds-text-dark);--e-adv:var(--ds-color-company-red);--e-loop:var(--ds-gray-medium);
--have-bg:var(--ds-gray-x-light);--have-bd:var(--ds-gray-medium);--have-ink:var(--ds-text-dark);--need-bg:var(--ds-color-white);--need-bd:var(--ds-color-company-red);--need-ink:var(--ds-color-company-red);
--band-bd:var(--ds-gray-light);--band-bg:var(--ds-color-white);--band-hd:var(--ds-other-100);--sub-bd:var(--ds-gray-medium);--sub-bg:transparent;
--cv1:var(--ds-text-dark);--cv1-ink:var(--ds-text-on-color);--cv2:var(--ds-other-100);--cv2-ink:var(--ds-text-dark);--cv3:var(--ds-color-white);--cv3-ink:var(--ds-color-company-red);
--pain-bg:var(--ds-other-100);--pain-bd:var(--ds-color-company-red);--vf:var(--ds-text-dark);--chg:var(--ds-color-company-red);--focus:var(--ds-color-company-red);--btn-on:var(--ds-text-dark);color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ds-font-sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px;cursor:pointer;transition:background .18s,border-color .18s,color .18s,box-shadow .18s,transform .18s}
button:hover{border-color:var(--ds-gray-dark);box-shadow:var(--sh-sm)}button:active{transform:translateY(1px)}
button:focus-visible,.nd:focus-visible{outline:2px solid var(--focus);outline-offset:2px}button:disabled{opacity:.35;cursor:default;box-shadow:none}
button[aria-pressed="true"]{background:var(--btn-on);color:var(--ds-text-on-color);border-color:var(--btn-on)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.fill svg{fill:currentColor;stroke:none}
/* 머리글 */
#top{padding:18px 22px 8px;max-width:100%}
.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:16px 20px;box-shadow:var(--sh-lg);position:relative;overflow:hidden}

/* 지도 카드 */
#stageWrap{position:relative;margin:4px 22px 0;background:var(--surface);border-radius:20px;box-shadow:var(--sh-lg);overflow:hidden}

#btnExitPresent{display:none}
.slnav{position:absolute;top:calc(50% + 20px);transform:translateY(-50%);z-index:50;width:44px;height:44px;border-radius:50%;padding:0;font-size:24px;line-height:40px;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-md);opacity:.9}
.slnav:hover{opacity:1;color:var(--red)}.slnav.prev{left:calc(var(--lbw) + 14px)}.slnav.next{right:14px}.slnav:disabled{opacity:0;pointer-events:none}

#corner b{font-size:14px;color:var(--ink-strong);margin-bottom:3px}#corner span{height:23px;display:flex;align-items:center}

.lc.aih{background:var(--surface);border-top:2px solid var(--red);align-items:center;padding-top:5px}.lc.aih b{color:var(--red)}.lc.aih .lic{background:var(--red);color:var(--ds-text-on-color);width:22px;height:22px;padding:4px}

.cp.s{border-radius:999px}.cp.h{background:var(--have-bg);border-color:var(--have-bd);color:var(--have-ink)}.cp.n{background:var(--need-bg);border-color:var(--need-bd);color:var(--need-ink);border-style:dashed}
.cp.more{border-color:var(--line);color:var(--ink3);background:transparent}.lc.sub .cp{max-width:118px}
/* 보드 배경 */
.bg{position:absolute;left:0;pointer-events:none}
.stband{top:0}.stband.odd{background:var(--stage-alt)}

.bandh b{color:var(--red);font-size:12px}.bandh .bd{color:var(--ink2)}.bandh .chips{display:inline;line-height:normal}.bandh .cp{margin:0 3px 0 0}

/* 연결선 */
#edges{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:visible}
.e{fill:none;stroke:var(--e-def);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round}.e-loop{stroke:var(--e-loop);stroke-dasharray:2 3}.e-rej{stroke:var(--e-rej);stroke-dasharray:5 3}

/* 위쪽 컨트롤 막대: 높이·간격·눌림 상태 통일 */
#controls{gap:8px 10px;padding:9px 14px;align-items:center}
#controls>button{height:32px;padding:0 14px;font-size:12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;color:var(--ink)}
#controls>button:hover{border-color:var(--red);color:var(--red);box-shadow:var(--sh-sm)}
#controls>button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--ds-text-on-color);box-shadow:0 2px 8px rgba(204,0,0,.22)}
#controls .grp{gap:7px;padding-left:2px}
#controls .grp>span{font-size:10.5px;letter-spacing:.4px}
#controls .seg{height:32px;align-items:center;padding:3px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
#controls .seg button{height:26px;padding:0 11px;font-size:12px;color:var(--ink2)}
#controls .seg button:hover{color:var(--ink-strong);background:var(--surface)}
#controls .seg button[aria-pressed="true"]{color:var(--ink-strong);background:var(--surface);box-shadow:0 1px 3px rgba(8,15,52,.12)}
#controls .seg button[data-scr="ns"][aria-pressed="true"]{background:var(--red);color:var(--ds-text-on-color)}
#controls .navb button{width:32px;height:32px;line-height:30px;border:1px solid var(--line-strong);background:var(--surface)}
#controls .stitle{font-size:12.5px;padding-right:12px}
/* 요약 막대 */
#summary .sm{font-size:12px}#summary .sm.on{font-size:12.5px}
.smb{height:9px}
/* 범례 카드 */
#legend{padding:10px 16px;row-gap:8px}
#legend .lgg{align-items:center}
#legend .lgg>b{font-size:10.5px;letter-spacing:.3px;color:var(--ink-strong)}
/* 지도 카드 */
#stageWrap{box-shadow:0 1px 0 var(--line),var(--sh-lg)}
#slbar{padding:10px 18px}
#stagehead{box-shadow:0 1px 0 var(--line)}
/* 단계 머리: 글자가 늘 화면 안에 보이게 */
.cv{overflow:visible}
.cv .cvi{position:sticky;left:calc(var(--lbw) + 16px);right:16px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.cv.wide{justify-content:flex-start;padding-left:16px}
.cv span{overflow:visible;text-overflow:clip}
.cv.r1{letter-spacing:.1px}
/* 레인 이름 카드 */
#labels .lc{transition:box-shadow .2s,border-color .2s}
#labels .lc.sub{border-radius:14px}
#labels .lc.sub:hover{box-shadow:var(--sh-md)}
/* 박스 */
.nd{border-radius:11px;transition:left .62s cubic-bezier(.2,.7,.2,1),top .62s cubic-bezier(.2,.7,.2,1),box-shadow .2s,transform .2s,opacity .4s}
.nd:hover{box-shadow:0 8px 22px rgba(8,15,52,.10)}
.elab{border-radius:999px;box-shadow:0 1px 2px rgba(8,15,52,.06)}
/* 양옆 넘김 버튼 */
.slnav{width:42px;height:42px;line-height:38px;opacity:.6;box-shadow:var(--sh-md);backdrop-filter:blur(4px)}
.slnav:hover{opacity:1}
/* 상세 창 */
#panel{scrollbar-gutter:stable}
#panel .ph{letter-spacing:.2px}
#panel table.kv tr:nth-child(odd) td,#panel table.kv tr:nth-child(odd) th{background:var(--ds-gray-x-light)}
#panel .painbox{border-radius:14px}
#toast{box-shadow:var(--sh-xl);padding:9px 20px;letter-spacing:.1px}
/* ===== Agent 상세 페이지 ===== */
.kpis{border-radius:18px}
#apm section>h3{letter-spacing:-.2px}
/* Agent 구조도 */
.fx{background:linear-gradient(180deg,var(--surface),var(--ds-gray-x-light))}
.fx-ag{justify-content:flex-start;border-radius:18px}
.fx-in,.fx-out{justify-content:flex-start}
.fx-row+.fx-hand+.fx-row{margin-top:0}
.fbx{border-radius:13px}
.fbx h6{letter-spacing:.1px}
/* 표 (필요한 데이터·활용 시스템·맡는 업무) 통일 */
.tblw{border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--surface);box-shadow:var(--sh-sm);max-height:none}
table.mx,table.tk{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;line-height:1.5}
table.mx thead th,table.tk thead th{position:sticky;top:0;z-index:1;background:var(--cream);color:var(--ink-strong);font-weight:700;font-size:11.5px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--cream3);white-space:nowrap}
table.mx tbody td,table.tk tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;background:var(--surface)}
table.mx tbody tr:last-child td,table.tk tbody tr:last-child td{border-bottom:0}
table.mx tbody tr:hover td,table.tk tbody tr:hover td{background:var(--ds-gray-x-light)}
table.mx td:first-child{min-width:150px}
table.mx td .fmt{white-space:nowrap}
table.mx td.src{font-size:11px;color:var(--ink3);min-width:120px}
table.mx .rk{white-space:nowrap}
/* 세부 Agent 섹션 */
.sbs{border-radius:22px}
.sbs>header{padding-bottom:6px;border-bottom:1px dashed var(--line);margin-bottom:10px}
table.prof td.eff{background:var(--cream)}
.pcol ul.dsl:has(li:nth-child(7)){columns:2 170px;column-gap:22px}.pcol ul.dsl li{break-inside:avoid}
/* 세부 Agent 흐름 그림: '언제'는 연하게 */
.fg li .wh,.sy .wh{color:var(--ink3);font-size:10.4px}
.fg li .wh b,.sy .wh b{background:transparent;padding:0;color:var(--red)}
.dfc{border-radius:18px}
/* 발표 모드 막대: 한 줄로 */
body.present #slbar{flex-wrap:nowrap;gap:12px;overflow-x:auto;padding:8px 14px}
body.present .ptitle{font-size:12.5px;white-space:nowrap;margin-right:4px}
body.present #pctl{flex-wrap:nowrap;gap:6px}
body.present #btnExitPresent{white-space:nowrap;height:30px;padding:0 13px;border-radius:999px}
body.present #sldots{flex:0 0 auto}
/* 편집 모드 막대 */
#edbar{border-radius:14px}
/* 일반 모드에서도 박스를 누르면 수정 도구 */
body:not(.fediting) #board .nd.sel{outline:2px dashed var(--red);outline-offset:3px}
#edtb{animation:rise .18s ease both}
/* AI Agent: Y축은 'AI Agent' 하나, 지도 안에서 묶음 박스로 */
#labels .lc.ai-all{display:block;padding:0;overflow:visible;border-top:2px solid var(--red);background:linear-gradient(90deg,var(--cream),var(--surface) 85%)}
#labels .lc.ai-all .aiin{position:sticky;top:96px;display:flex;align-items:flex-start;gap:10px;padding:14px 14px 12px}
#labels .lc.ai-all .lic{background:var(--red);color:var(--ds-text-on-color);width:30px;height:30px;padding:6px;border-radius:10px;flex:0 0 auto}
#labels .lc.ai-all b{display:block;font-size:17px;color:var(--red);letter-spacing:-.2px}
#labels .lc.ai-all small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
#labels .lc.ai-all small.aih2{font-size:10.5px;color:var(--ink3);line-height:1.5;margin-top:6px}
.bg.row-band,.bg.row-sub{background:transparent}
.gbox{position:absolute;z-index:1;pointer-events:none;border-radius:18px}
.gbox.gb{background:color-mix(in srgb,var(--red) 3.5%,var(--surface));border:1.5px solid color-mix(in srgb,var(--red) 30%,var(--surface));box-shadow:var(--sh-sm)}
.gbox.gs{background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--red) 42%,var(--surface));border-radius:14px}
.gbox .gt{position:absolute;left:12px;top:6px;display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:auto;cursor:pointer;line-height:1.3}
.gbox.gs .gt{top:5px;left:10px}
.gbox .gt:hover b{text-decoration:underline;text-underline-offset:3px}
.gbox .gi{width:20px;height:20px;padding:3px;border-radius:7px;background:var(--surface);color:var(--red);box-shadow:var(--sh-sm)}
.gbox.gb .gt b{font-size:13px;color:var(--red)}
.gbox.gs .gt b{font-size:11.8px;color:var(--red)}
.gbox .gd{font-size:11px;color:var(--ink2)}
.gbox .gc{font-size:10px;color:var(--ink2);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:0 8px;line-height:17px}
/* 촘촘한 지도 */
.nd{padding:5px 7px 6px}
.nd .lbl{line-height:1.32}
.e.xrow{opacity:.5}
.gbox.gs .gt{top:4px}
.gbox.gb .gt{top:5px}
/* 더 촘촘하게 (참고: 자동차보상 HTML — 열 122 · 박스 112) */
.nd{padding:4px 6px 5px 7px;border-radius:8px}
.nd .nl{display:flex;gap:4px;align-items:flex-start}.nd .nl .nk{flex:0 0 auto;margin-top:2px}.nd .nl .lbl{margin-top:0;flex:1;min-width:0}
.nd .nt{margin-bottom:1px}
.gbox .gt{position:absolute;left:8px;right:8px;top:4px;white-space:normal;line-height:1.3}
.gbox.gb{border-radius:12px}.gbox.gs{border-radius:10px}
.gbox.gb .gt b{font-size:11.5px}.gbox.gs .gt b{font-size:10.5px}
.gbox .gi{width:16px;height:16px;padding:2px;vertical-align:-3px;margin-right:4px}
#labels .lc.lane .lt b{font-size:11.5px}
/* As-Is ↔ To-be 전환: 천천히, 함께 미끄러지게 */
:root{--mt:1.9s;--ez:cubic-bezier(.65,0,.35,1)}
#board .bg.stband{z-index:0}#board .bg[class*="row-"]{z-index:1}#board .bg.sep{z-index:2}#board .gbox{z-index:3}#edges{z-index:4}
#edges{transition:opacity .6s ease}
body.morph #edges{opacity:0}
body.morph #board .nd,#afb.morph .nd{transition:left var(--mt) var(--ez),top var(--mt) var(--ez),width var(--mt) var(--ez),height var(--mt) var(--ez),background-color var(--mt) ease,border-color var(--mt) ease,box-shadow var(--mt) ease,opacity .7s ease}
body.morph #board .bg.stband,body.morph #board .bg.sep{transition:left var(--mt) var(--ez),width var(--mt) var(--ez),height var(--mt) var(--ez)}
body.morph #board .bg[class*="row-"]{transition:top var(--mt) var(--ez),height var(--mt) var(--ez),width var(--mt) var(--ez)}
body.morph #labels .lc{transition:top var(--mt) var(--ez),height var(--mt) var(--ez)}
body.morph #stagehead .cv{transition:left var(--mt) var(--ez),width var(--mt) var(--ez)}
.gin{animation:gin .8s ease both;animation-delay:calc(var(--mt) * .72)}
@keyframes gin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.morph.to-ns #board .nd.k-a,body.morph.to-ns #board .nd.k-na{box-shadow:inset 3px 0 0 var(--red),0 0 0 3px var(--cream),var(--sh-md)}
/* 박스에는 글자만 */
#board .nd,#afb .nd{padding:5px 6px 5px 7px}
#board .nd .lbl,#afb .nd .lbl{margin-top:0;font-size:10px;line-height:1.32}
#board .nd.L4 .lbl{font-size:11px;font-weight:700}
#panel .pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 10px;font-size:11.5px;color:var(--ink2)}
#panel .pmeta b{font-size:11px;color:var(--ink-strong)}#panel .pmeta .mbar{display:inline-flex;width:120px;height:6px;border-radius:999px;overflow:hidden;gap:1px;background:var(--ds-gray-light)}#panel .pmeta .mbar i{display:block;height:100%}
#panel .chgt{color:var(--red);font-weight:700}
/* ===== 2차 뷰티파이 ===== */
/* 박스: 글자만 있는 카드 */
#board .nd{border-radius:7px;border-color:var(--line-strong);box-shadow:inset 3px 0 0 var(--h-ac),0 1px 2px rgba(8,15,52,.05)}
#board .nd:hover{transform:translateY(-1px);box-shadow:inset 3px 0 0 var(--h-ac),0 6px 16px rgba(8,15,52,.10)}
#board .nd .lbl{color:var(--ink-strong);letter-spacing:-.1px}
#board .nd.k-a,#board .nd.k-na{border-color:color-mix(in srgb,var(--red) 36%,var(--surface));box-shadow:inset 3px 0 0 var(--red),0 1px 2px rgba(8,15,52,.05)}
#board .nd.k-a:hover,#board .nd.k-na:hover{box-shadow:inset 3px 0 0 var(--red),0 6px 16px rgba(204,0,0,.13)}
#board .nd.k-nh{border-color:var(--cream3);box-shadow:inset 3px 0 0 var(--cream3),0 1px 2px rgba(8,15,52,.05)}
#board .nd.k-nh:hover{box-shadow:inset 3px 0 0 var(--cream3),0 6px 16px rgba(8,15,52,.10)}
#board .nd.k-mk{border-radius:7px}#board .nd.k-mk .lbl{color:var(--mk-ink)}
#board .nd.k-gone{background:var(--ds-gray-x-light);box-shadow:none}#board .nd.k-gone .lbl{color:var(--gone-ink)}
#board .nd.k-pt{box-shadow:none}#board .nd.k-pt .lbl{color:var(--ink2)}
#board .nd.k-why{box-shadow:none}#board .nd.k-why .lbl{color:var(--ink);font-size:9.6px}
/* 묶음 박스 */
.gbox.gb{background:color-mix(in srgb,var(--cream) 50%,var(--surface));border:1px solid color-mix(in srgb,var(--red) 20%,var(--surface));box-shadow:inset 3px 0 0 var(--red),0 1px 3px rgba(8,15,52,.05);border-radius:12px}
.gbox.gs{background:var(--surface);border:1px dashed color-mix(in srgb,var(--red) 38%,var(--surface));border-radius:9px}
.gbox .gt{display:flex;align-items:flex-start;gap:5px}
.gbox.gb .gt b{font-size:11.2px;letter-spacing:-.1px;line-height:1.25;color:var(--red)}
.gbox.gs .gt b{font-size:10.2px;line-height:1.25;color:color-mix(in srgb,var(--red) 82%,var(--ink-strong))}
.gbox .gi{flex:0 0 auto;margin:0}
/* 선: 줄을 넘는 선은 가는 회색, 박스에 마우스를 올리면 그 박스의 선만 또렷하게 */
#edges .e.xrow{stroke:var(--ds-gray-dark);stroke-width:1;opacity:.42}
#edges path.e{transition:opacity .2s ease,stroke-width .2s ease}
#board.efocus #edges path.e{opacity:.1}
#board.efocus #edges path.e.hot{opacity:1;stroke-width:2.2}
#board.efocus #edges path.e.hot.xrow{stroke:var(--ink)}
.elab{font-size:9.5px;padding:0 7px}
/* 지도 카드: 내용이 짧으면 빈 칸 없이 */
#wrap{transition:height .3s ease}
/* ===== 3차 디자인: 빨강은 포인트로만, 차분하게, 한 덩어리로 ===== */
/* 머리 카드 */
.hero::after{display:none}
.hero{padding:20px 26px 16px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(8,15,52,.05)}
.hero h1{font-size:26px;letter-spacing:-.6px}
.hero .crumb{font-size:11.5px;color:var(--ink3)}
.steps{margin-top:14px}
.stp2{border-radius:12px;box-shadow:none;border-color:var(--line);background:var(--surface)}
.stp2:hover{box-shadow:0 4px 12px rgba(8,15,52,.08)}
.stp2 .sn{background:var(--bg);color:var(--ink-strong)}
/* 툴바 */
#controls{border-radius:16px;padding:8px 12px;box-shadow:0 6px 18px rgba(8,15,52,.06);gap:8px 10px}
#controls .grp+.grp,#controls .grp+button,#controls button+.grp{margin-left:2px}
#controls .grp>span{color:var(--ink3);font-weight:700}
#controls>button{height:30px;font-size:11.8px;color:var(--ink2)}
#controls .seg{height:30px}#controls .seg button{height:24px;font-size:11.5px}
#controls .navb button{width:30px;height:30px;line-height:28px;color:var(--ink2)}
/* 요약 + 범례를 한 카드로 */
#summary{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:11px 18px 7px;margin:10px 0 0;flex-direction:row;flex-wrap:wrap;gap:6px 30px}
#summary .sm{font-size:11.5px;color:var(--ink3)}#summary .sm.on{font-size:11.8px;color:var(--ink-strong)}
#legend{border:1px solid var(--line);border-top:1px dashed var(--line);border-radius:0 0 16px 16px;box-shadow:none;margin:0 0 4px;padding:8px 18px 10px;font-size:10.8px}
#legend .lgg>b{font-size:10px;color:var(--ink3);letter-spacing:.4px}
/* 지도 카드 */
#stageWrap{border-radius:18px;border:1px solid var(--line);box-shadow:0 12px 32px rgba(8,15,52,.06)}
#slbar{background:var(--surface);padding:9px 18px}
#corner b{font-size:13px}
/* 단계 머리: 덜 무겁게 (진한 단계명 한 줄 + 회색 구성 + 빨간 게이트 글자) */
.cv.r1{top:7px;height:24px;border-radius:8px;font-size:11.5px;background:var(--ink);box-shadow:none}
.cv.r2{top:35px;height:18px;background:transparent;color:var(--ink2);font-size:10.4px;border-radius:0}
.cv.r3{top:56px;height:18px;background:transparent;border:0;color:var(--red);font-size:10.4px}
.cv.r3 .cvi::before{content:"◆";font-size:7px;margin-right:1px;position:relative;top:-1px}
.cv.r2:not(.wide),.cv.r3:not(.wide){justify-content:center}
.cv.r2.wide,.cv.r3.wide{padding-left:18px}
/* 레인 이름·배경 */
#labels .lc.lane{padding:7px 10px;gap:8px}
#labels .lc.lane .lic{width:20px;height:20px;padding:4px;background:var(--bg);color:var(--ink2)}
#labels .lc.lane .lt b{font-size:11.5px;color:var(--ink-strong)}
#labels .lc.lane .lt small{font-size:9.8px;color:var(--ink3)}
.row-lane.alt,.alt{background:color-mix(in srgb,var(--bg) 55%,var(--surface))}
.sep{border-left:1px solid var(--line)}
.row-aih{background:linear-gradient(180deg,color-mix(in srgb,var(--cream) 40%,var(--surface)),var(--surface) 180px)!important;border-top:2px solid var(--red)}
/* 묶음 제목: 큰 기능은 빨강, 세부는 진한 회색 */
.gbox.gs .gt b{color:var(--ink-strong)}
.gbox.gb .gt b{color:var(--red)}
/* 상세 창 */
#panel{border:1px solid var(--line)}
.sw.ln.x{border-top:1px solid var(--ds-gray-dark);opacity:.6}
.sw.fr.big{background:color-mix(in srgb,var(--cream) 50%,var(--surface));border:1px solid color-mix(in srgb,var(--red) 20%,var(--surface));box-shadow:inset 3px 0 0 var(--red)}
.sw.fr.small{background:var(--surface);border:1px dashed color-mix(in srgb,var(--red) 38%,var(--surface))}
/* Orchestrator 신호선 */
.e-orc{stroke:var(--ink-strong);stroke-width:1.5;stroke-dasharray:5 3}
.sw.ln.k{border-top:2px dashed var(--ink-strong)}
.elab.orc,.elab:has(+.orc){font-weight:700}
/* 흐름 보기: 선이 굵고 또렷하게 */
body.vflow #edges path.e{stroke-width:1.6}
body.vflow #edges path.e.e-ai{stroke-width:1.8}
body.vflow #board .nd .lbl{font-size:10.4px}
/* 라벨 종류: 신호(진한), 다른 Agent와 주고받는 것(빨간 테두리) */
.elab.k{border-color:var(--ink-strong);color:var(--ink-strong);font-weight:700;background:var(--surface)}
.elab.x{border-color:var(--red);color:var(--red);font-weight:700;background:var(--surface)}
.e.hand{stroke:var(--red);stroke-width:1.7;stroke-dasharray:6 3}
/* Agent 흐름도: 다른 Agent 레인·바깥 박스 */
.afn.ext{opacity:.78;border-style:dashed}
.afl.oth .xch{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:10.5px;color:var(--ink2);line-height:1.35}
.afl.oth .xch i{font-style:normal;font-weight:700;margin-right:4px;padding:0 5px;border-radius:999px;font-size:9.5px}
.afl.oth .xg i{background:var(--red);color:var(--ds-text-on-color)}.afl.oth .xt i{background:var(--ink);color:var(--ds-text-on-color)}
.afrow.oth{background:color-mix(in srgb,var(--ds-gray-x-light) 70%,var(--surface))}
/* 상세 창: 선행 업무 / 후행 업무 */
#panel .pflow{display:grid;grid-template-columns:1fr;gap:8px;margin:2px 0 14px}
#panel .pf{border:1px solid var(--line);border-radius:12px;padding:9px 12px 8px;background:var(--surface)}
#panel .pf.in{border-left:3px solid var(--ds-gray-dark)}#panel .pf.out{border-left:3px solid var(--red)}
#panel .pf h4{margin:0 0 6px;font-size:12.5px;display:flex;align-items:center;gap:6px}#panel .pf h4 small{color:var(--ink3);font-weight:400;font-size:11px}
#panel .pf .ar{font-weight:900;color:var(--red)}#panel .pf.in .ar{color:var(--ds-gray-dark)}
#panel .pf ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#panel .pf li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12px;line-height:1.45}
#panel .pf .fgo{font-weight:700;color:var(--ink-strong);text-align:left;padding:0;background:none;border:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
#panel .pf .fgo:hover{color:var(--red);text-decoration-color:var(--red)}
#panel .pf .fw{font-size:11px;color:var(--red);font-weight:700}#panel .pf.in .fw{color:var(--ink2)}
#panel .pf .ft{font-size:10.5px;padding:0 7px;border-radius:999px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
#panel .pf .none{margin:0;font-size:11.5px;color:var(--ink3)}
#panel .pflow.gone p{margin:0;font-size:12px;color:var(--ink3)}
#panel .painbox{margin-top:16px}
/* 흐름 (넓게): 굵은 선·큰 화살촉·여유 있는 박스 */
body.vflow #board .nd{padding:7px 9px}
body.vflow #board .nd .lbl{font-size:11px;line-height:1.38}
body.vflow #edges path.e{stroke-width:1.9}
body.vflow #edges path.e.e-ai{stroke-width:2.1}
body.vflow #edges path.e.e-orc{stroke-width:1.9}
body.vflow .elab{font-size:10.5px}
/* 상세 창: 이 박스는 (맨 위) */
#panel h3{margin-top:4px}
#panel .pwhat{border-radius:12px;background:color-mix(in srgb,var(--cream) 55%,var(--surface));border:1px solid var(--cream3);padding:10px 13px 10px;margin:0 0 10px}
#panel .pwhat b{display:block;font-size:11px;letter-spacing:.3px;color:var(--red);margin-bottom:3px}
#panel .pwhat p{margin:0;font-size:13.2px;line-height:1.6;color:var(--ink-strong)}
#panel .pwhat small{display:block;margin-top:5px;font-size:11.2px;color:var(--ink2)}
/* 상세 창 맨 끝: 이 박스 수정 (지도 위 떠 있던 도구 스타일 덮어쓰기) */
#panel #edtb{position:static;display:block;z-index:auto;white-space:normal;background:none;border:0;border-top:1px dashed var(--line-strong);border-radius:0;box-shadow:none;padding:12px 0 0;animation:none}
#panel #edtb button,#panel #edtb select,#panel #edtb input{font-size:12px;border-radius:999px}
#panel #edtb input,#panel #edtb select{width:auto;border-radius:8px}
/* 상세 창 맨 끝: 이 박스 수정 */
#panel .ped{margin-top:16px;border-top:1px dashed var(--line-strong);padding-top:12px}
#panel .ped h4{margin:0 0 8px;font-size:12.5px}
#panel .pedr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#panel .pedr button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;cursor:pointer}
#panel .pedr button:hover{border-color:var(--ink2)}#panel .pedr button.danger{color:var(--red);border-color:var(--red)}
#panel .pedf{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:12px}
#panel .pedf span{width:64px;color:var(--ink2);font-weight:700}
#panel .pedf input,#panel .pedf select{flex:1;height:30px;border:1px solid var(--line-strong);border-radius:8px;padding:0 9px;font-size:12px;background:var(--surface);color:var(--ink-strong)}
#panel .pedh{margin:6px 0 0;font-size:11px;color:var(--ink3);line-height:1.5}
/* 상세 창은 위쪽 조작 막대를 가리지 않게 그 아래에서 열림 */
#panel{top:calc(var(--ctlb, 18px) + 10px);max-height:calc(100vh - var(--ctlb, 18px) - 24px)}
body.present #panel{top:calc(18px + env(safe-area-inset-top,0px));max-height:84vh}
/* 누른 박스의 앞·뒤 흐름 고정 표시 */
#board.pinned .nd:not(.fsel):not(.fnb){opacity:.35}
#board.pinned .gbox{opacity:.6}
#board.pinned .elab{opacity:.12}#board.pinned .elab.hot{opacity:1}
#board .nd.fsel{opacity:1;box-shadow:0 0 0 3px var(--red),0 8px 20px rgba(204,0,0,.18)!important}
#board .nd.fin{opacity:1;box-shadow:0 0 0 2px var(--ink2),0 4px 10px rgba(8,15,52,.12)!important}
#board .nd.fout{opacity:1;box-shadow:0 0 0 2px var(--red),0 4px 10px rgba(204,0,0,.12)!important}
#board.pinned #edges path.e.hot{opacity:1;stroke-width:2.6}
.elab{white-space:nowrap}
/* ===== 한눈에 보기: 덜어내고 깔끔하게 — 박스 글자 최대 3줄, 그림자 없음, 선 라벨 없음, Orchestrator는 연한 회색 ===== */
body:not(.vflow) #board .nd{border-color:var(--line);box-shadow:inset 3px 0 0 var(--h-ac)}
body:not(.vflow) #board .nd:hover{box-shadow:inset 3px 0 0 var(--h-ac),0 4px 12px rgba(8,15,52,.10)}
body:not(.vflow) #board .nd .lbl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:9.6px;line-height:1.3;color:var(--ink)}
body:not(.vflow) #board .nd.k-a,body:not(.vflow) #board .nd.k-na{border-color:color-mix(in srgb,var(--red) 26%,var(--surface));box-shadow:inset 3px 0 0 var(--red)}
body:not(.vflow) #board .nd.k-nh{box-shadow:inset 3px 0 0 var(--cream3)}
body:not(.vflow) #board .nd.k-mk{background:var(--ds-gray-light);border-color:var(--ds-gray-medium);box-shadow:inset 3px 0 0 var(--ink)}
body:not(.vflow) #board .nd.k-mk .lbl{color:var(--ink-strong)}
body:not(.vflow) #board .nd.k-why .lbl{-webkit-line-clamp:2}
body:not(.vflow) #edges .e.xrow{opacity:.28}
body:not(.vflow) #board.efocus #edges path.e.hot{opacity:1}
/* ===== 흐름 (넓게): 박스 아래 '넘기는 것' 한 줄 ===== */
#board .nd .nds{margin-top:4px;padding-top:3px;border-top:1px dashed var(--line);font-size:9.8px;line-height:1.35;color:var(--ink3)}
#board .nd.k-a .nds,#board .nd.k-na .nds{color:color-mix(in srgb,var(--red) 70%,var(--ink2))}
#board .nd.k-mk .nds{color:var(--mk-ink);opacity:.85;border-top-color:rgba(255,255,255,.25)}
/* ===== 흐름 설명 — 색은 박스 종류와 같게: Agent 빨강 · 담당자 확인·판단 갈색 · 사람 직접 회색 · Orchestrator 검정 ===== */
:root{--k-ai:#D0021B;--k-hitl:#0E8A5F;--k-hu:#7B8290;--k-orc:#151A22;--k-ai-t:#FDECEE;--k-hitl-t:#E9F6F0;--k-hu-t:#F1F3F5;--k-orc-t:#E4E7EB;
  --nh-ac:var(--k-hitl);--nh-bd:#A8D9C4;--nh-bg:#EEF8F3;--h-ac:var(--k-hu);--mk-ac:#8B95A1;--e-hitl:var(--k-hitl)}
/* 박스 색 = 동그라미 색: Agent 빨강 · 담당자 확인·판단 초록 · 사람 직접 회색 · Orchestrator 검정 */
#board .nd.k-nh{border-color:var(--nh-bd);box-shadow:inset 3px 0 0 var(--nh-ac),0 1px 2px rgba(8,15,52,.05)}
#board .nd.k-nh:hover{box-shadow:inset 3px 0 0 var(--nh-ac),0 6px 16px rgba(8,15,52,.10)}
body:not(.vflow) #board .nd.k-nh{box-shadow:inset 3px 0 0 var(--nh-ac)}
body:not(.vflow) #board .nd.k-mk{box-shadow:inset 3px 0 0 var(--k-orc)}
#edges path.agf-bh{stroke:var(--k-hitl)}.sw.ln.bbh{border-top-color:var(--k-hitl)!important}#labels .lc.agv .agk i.bh{border-top-color:var(--k-hitl)!important}
.elab.bl.bh{color:var(--k-hitl);border-color:var(--k-hitl)}
/* 번호 동그라미: 묶음 번호는 색 없는 테두리 원(주체 색과 헷갈리지 않게), 단계 번호는 주체 색 */
#board .sc ol.sc-bt li i,.af .afstory li i,#tourcap .tno{background:var(--surface)!important;color:var(--ink-strong)!important;box-shadow:inset 0 0 0 1.6px var(--ink-strong)}
.chn{display:inline;line-height:1.9}
.chn s{text-decoration:none;color:var(--ink3);margin:0 3px;font-weight:700}
.chn em{display:inline-block;font-style:normal;font-size:10.2px;line-height:16px;padding:0 6px;border-radius:6px;border:1px solid;white-space:nowrap;vertical-align:middle;cursor:pointer}
.chn em u{text-decoration:none;font-weight:700;margin-right:4px}
.chn em.ai{color:var(--k-ai);border-color:color-mix(in srgb,var(--k-ai) 40%,transparent);background:color-mix(in srgb,var(--k-ai) 7%,var(--surface))}
.chn em.hitl{color:var(--k-hitl);border-color:color-mix(in srgb,var(--k-hitl) 45%,transparent);background:#F6EEE2}
.chn em.hu{color:var(--k-hu);border-color:color-mix(in srgb,var(--k-hu) 40%,transparent);background:var(--ds-gray-x-light)}
.chn em.orc{color:#fff;border-color:var(--k-orc);background:var(--k-orc)}
.chn em.now{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor;font-weight:700}
.chn em.orc.now{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--k-orc)}
.chn em.done{opacity:.45}
.chn em.me{font-weight:700;box-shadow:inset 0 -2px 0 currentColor}
.sc.narrow .chn em{width:12px;height:10px;padding:0;border-radius:3px}
#board .sc ol.sc-bt li{line-height:1.5}
#board .sc ol.sc-bt li i{background:var(--ink-strong)!important}
#board .sc ol.sc-bt li b{display:inline;margin-right:6px}
/* 번호 표시: 4-1처럼 같은 번호 안 순서 */
.sbadge{min-width:20px;width:auto!important;padding:0 5px;border-radius:10px!important;box-sizing:border-box}
.sbadge.hitl{background:var(--k-hitl)}.sbadge.hu{background:var(--k-hu)}.sbadge.orc{background:var(--k-orc)}.sbadge.ai{background:var(--k-ai)}
.sbadge.nb{background:var(--surface);color:var(--ink-strong);box-shadow:0 0 0 1.5px var(--ink-strong),0 2px 5px rgba(8,15,52,.2)}
body.touring .sbadge:not(.mate){opacity:.25}
body.touring .sbadge.mate{opacity:1}
/* 따라가기: 앞 단계 박스(옅은 테두리) → 지금 단계 박스(진한 테두리), 둘 사이 화살표가 흐름 */
#board.tour .nd.hl2{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--ink3) 55%,transparent)!important;z-index:7}
#board.tour #edges path.e.tflow{stroke-width:3;stroke-dasharray:7 5;animation:tflow .8s linear infinite;opacity:1}
@keyframes tflow{to{stroke-dashoffset:-24}}
#tourcap .tchain{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:3px 2px}
#tourcap .tchain s{text-decoration:none;color:var(--ink3);margin:0 2px;font-weight:700}
#tourcap .tsx{font-size:11px;line-height:20px;padding:0 8px;border-radius:7px;border:1px solid;background:var(--surface);cursor:pointer}
#tourcap .tsx u{text-decoration:none;font-weight:700;margin-right:4px}
#tourcap .tsx.ai{color:var(--k-ai);border-color:color-mix(in srgb,var(--k-ai) 40%,transparent)}
#tourcap .tsx.hitl{color:var(--k-hitl);border-color:color-mix(in srgb,var(--k-hitl) 45%,transparent)}
#tourcap .tsx.hu{color:var(--k-hu);border-color:color-mix(in srgb,var(--k-hu) 40%,transparent)}
#tourcap .tsx.orc{color:var(--k-orc);border-color:var(--k-orc)}
#tourcap .tsx.now{color:#fff;font-weight:700}
#tourcap .tsx.now.ai{background:var(--k-ai)}#tourcap .tsx.now.hitl{background:var(--k-hitl)}#tourcap .tsx.now.hu{background:var(--k-hu)}#tourcap .tsx.now.orc{background:var(--k-orc)}
#tourcap .tsx.done{opacity:.5}
#tourcap .tnow{margin-top:9px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
#tourcap .twho{font-size:12px;font-weight:700;color:#fff;padding:1px 9px;border-radius:7px}
#tourcap .twho.ai{background:var(--k-ai)}#tourcap .twho.hitl{background:var(--k-hitl)}#tourcap .twho.hu{background:var(--k-hu)}#tourcap .twho.orc{background:var(--k-orc)}
#tourcap .tkd{font-size:10.5px;color:var(--ink3)}
#tourcap .tnow p{flex-basis:100%;margin:2px 0 0;font-size:13px;line-height:1.55;color:var(--ink)}
#tourcap .tno{background:var(--ink-strong)!important}
#tourcap .tlv{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
#tourcap .tlv button{border:0!important;border-radius:0!important;padding:4px 9px!important}
#tourcap .tlv button[aria-pressed="true"]{background:var(--ink-strong);color:#fff}
#tourcap .tbt button.on{background:var(--ink-strong);color:#fff;border-color:var(--ink-strong)}
#tourcap .tkey{margin-left:auto;font-size:10px;color:var(--ink3);white-space:nowrap}
#tourcap .tkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 7px;vertical-align:-1px}
#tourcap .tkey i.ai,#labels .lc.story .stk i.ai{background:var(--k-ai)}#tourcap .tkey i.hitl,#labels .lc.story .stk i.hitl{background:var(--k-hitl)}#tourcap .tkey i.hu,#labels .lc.story .stk i.hu{background:var(--k-hu)}#tourcap .tkey i.orc,#labels .lc.story .stk i.orc{background:var(--k-orc)}
#tourcap .thint{display:none}
#tourfocus{position:absolute;pointer-events:none;visibility:hidden}
.af .afstory li{white-space:normal;overflow:visible}
.af .afstory li i{background:var(--ink-strong)!important}
/* ===== 흐름 설명 줄 (지도 맨 위) ===== */
#board .bg.story{z-index:3;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:10px 12px 8px;box-shadow:0 2px 8px rgba(8,15,52,.05);overflow:hidden;pointer-events:auto}
#board .bg.story.asis{background:var(--ds-gray-x-light)}
#board .sc p{margin:0;font-size:11px;line-height:1.5;color:var(--ink2)}
#board .sc p b{display:inline-block;margin-right:6px;padding:0 6px;border-radius:5px;font-size:10px;line-height:16px;font-weight:700;background:var(--bg);color:var(--ink-strong)}
#board .sc .sc-chg{color:var(--ink-strong);font-weight:600}
#board .sc .sc-chg b{background:var(--red);color:#fff}
#board .sc.asis .sc-now b{background:var(--ds-gray-dark);color:#fff}
#board .sc.asis .sc-chg{margin-top:6px}
#board .sc ol.sc-bt{list-style:none;margin:7px 0 6px;padding:0;display:grid;grid-template-columns:1fr;gap:4px 14px}
#board .sc.wide ol.sc-bt{grid-template-columns:1fr 1fr}
#board .sc ol.sc-bt li{position:relative;padding:3px 6px 3px 26px;border-radius:7px;font-size:11px;line-height:1.45;color:var(--ink);cursor:pointer;transition:background .15s ease}
#board .sc ol.sc-bt li:hover{background:var(--bg)}
#board .sc ol.sc-bt li.on{background:color-mix(in srgb,var(--red) 10%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--red)}
#board .sc ol.sc-bt li i{position:absolute;left:4px;top:3px;width:17px;height:17px;border-radius:50%;font-style:normal;font-size:10px;font-weight:700;line-height:17px;text-align:center;color:#fff;background:var(--ds-gray-dark)}
#board .sc ol.sc-bt li.ai i{background:var(--red)}#board .sc ol.sc-bt li.orc i{background:var(--ink-strong)}
#board .sc ol.sc-bt li b{font-weight:700;color:var(--ink-strong);margin-right:5px}
#board .sc ol.sc-bt li span{color:var(--ink2)}
#board .sc.narrow ol.sc-bt li{padding-right:2px;font-size:10.4px}
#board .sc.narrow .sc-chg{font-size:10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#board .sc.narrow .sc-nx{display:none}
#board .sc .sc-nx{font-size:10.5px;color:var(--ink3)}
/* Agent 페이지 흐름도: 한 화면 맞춤 + 이 Agent의 흐름 */
.af .afstory{margin:8px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.af .afstory:empty{display:none}
.af .afsh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.af .afsh b{font-size:12.5px;color:var(--red)}.af .afsh span{font-size:10.5px;color:var(--ink3)}
.af .afstory ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:4px 14px}
.af .afstory li{position:relative;padding:2px 4px 2px 26px;font-size:11px;line-height:1.45;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.af .afstory li i{position:absolute;left:3px;top:2px;width:17px;height:17px;border-radius:50%;font-style:normal;font-size:10px;font-weight:700;line-height:17px;text-align:center;color:#fff;background:var(--ds-gray-dark)}
.af .afstory li.ai i{background:var(--red)}.af .afstory li.orc i{background:var(--ink-strong)}
.af .afstory li em{font-style:normal;font-size:10px;color:var(--ink3);margin-right:5px}.af .afstory li b{color:var(--ink-strong);margin-right:5px}
.af .afwrap{overflow-x:auto;overflow-y:hidden}
.af .afsz{position:relative;overflow:hidden}
.af .afin{position:absolute;left:0;top:0}
#afb .nd.afn .lbl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:10.2px;line-height:1.3}
#afb .nd.afn{padding:4px 7px}
#aflab .afl .aflt small{font-size:10px}
#afb .nd.afn .afo{display:block;font-size:9px;line-height:1.2;color:var(--ink3);font-weight:700;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#afb .nd.afn.oth .lbl{-webkit-line-clamp:2}
.af .afctl .afstg button{min-width:46px}
#afb .afbg.afsec{background:transparent;border-top:2px solid var(--ink-strong)}
#afb .afbg.afsec.ns{border-top-color:var(--red)}
#afb .afbg.afsec span{position:absolute;left:8px;top:4px;font-size:11px;font-weight:700;color:var(--ink-strong)}
#afb .afbg.afsec.ns span{color:var(--red)}
#aflab .afl.sech{display:flex;align-items:center;padding-left:10px;font-size:11.5px;font-weight:700;color:#fff;background:var(--ink-strong);border-radius:6px 0 0 6px}
#aflab .afl.sech.ns{background:var(--red)}
#afb .nd.afn.twin{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--red)!important;z-index:7}
/* 박스 번호 */
.sbadge{position:absolute;z-index:9;width:20px;height:20px;border-radius:50%;font-size:10.5px;font-weight:700;line-height:20px;text-align:center;color:#fff;background:var(--ds-gray-dark);box-shadow:0 0 0 2px var(--surface),0 2px 5px rgba(8,15,52,.25);cursor:pointer;pointer-events:auto}
.sbadge.ai{background:var(--red)}.sbadge.orc{background:var(--ink-strong)}
.sbadge.on{transform:scale(1.25);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--red)}
/* 왼쪽 칸 안내 */
#labels .lc.story{align-items:flex-start;padding:12px;background:var(--surface)}
#labels .lc.story .lt b{font-size:12.5px;color:var(--red)}
#labels .lc.story .lt small{display:block;margin-top:5px;font-size:10.5px;line-height:1.5;color:var(--ink2);white-space:normal}
#labels .lc.story .tourgo{margin-top:8px;padding:4px 10px;border-radius:8px;border:0;background:var(--red);color:#fff;font-size:11px;font-weight:700;cursor:pointer}
#labels .lc.story .stk{display:block;margin-top:8px;font-size:10px;color:var(--ink3)}
#labels .lc.story .stk i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px 0 6px;vertical-align:-1px;background:var(--ds-gray-dark)}
#labels .lc.story .stk i.ai{background:var(--red)}#labels .lc.story .stk i.orc{background:var(--ink-strong)}
/* 흐름 따라가기 */
#board.tour .nd:not(.hl):not(.hl2){opacity:.45}
/* 따라가기 중 박스 색이 그대로 보이게: 지금 단계 = 그 종류 색 굵은 테두리 + 옅은 바탕, 앞 단계 = 같은 색 점선 */
#board.tour .nd.hl{animation:none!important}
#board.tour .nd.hl.k-a,#board.tour .nd.hl.k-na{box-shadow:inset 4px 0 0 var(--k-ai),0 0 0 2px var(--surface),0 0 0 5px var(--k-ai)!important;background:var(--k-ai-t)}

#tourcap .tc-key i.ai{background:var(--k-ai)}#tourcap .tc-key i.hitl{background:var(--k-hitl)}#tourcap .tc-key i.hu{background:var(--k-hu)}#tourcap .tc-key i.orc{background:var(--k-orc)}

/* 지도 위: 부드러운 스포트라이트 */

#board.tour .nd.hl.tk-orc{box-shadow:0 0 0 2px var(--k-orc),0 0 0 8px color-mix(in srgb,var(--k-orc) 12%,transparent),0 18px 30px -14px color-mix(in srgb,var(--k-orc) 55%,transparent)!important;border-color:var(--k-orc)!important}

#panel .pwhat .io.ai .io-c.do{background:var(--k-ai-t);border-color:color-mix(in srgb,var(--k-ai) 35%,var(--surface))}
#panel .pwhat .io.hitl .io-c.do{background:var(--k-hitl-t);border-color:color-mix(in srgb,var(--k-hitl) 35%,var(--surface))}
#panel .pwhat .io.orc .io-c.do{background:var(--k-orc-t);border-color:color-mix(in srgb,var(--k-orc) 30%,var(--surface))}
#panel .pwhat .io-c h5{display:flex;align-items:center;gap:5px;margin:0 0 5px;font-size:10.5px;font-weight:800;color:var(--ink2);letter-spacing:.02em}
#panel .pwhat .io-c h5 i{font-style:normal;font-size:10px;color:var(--ink3)}
#panel .pwhat .io-c.out h5{color:var(--ink-strong)}
#panel .pwhat .io-c ul{margin:0;padding-left:14px}
#panel .pwhat .io-c li{font-size:11.2px;line-height:1.45;margin:0 0 3px;color:var(--ink)}
#panel .pwhat .io-c li.more{list-style:none;margin-left:-14px;color:var(--ink3);cursor:help}
#panel .pwhat .io-c p{margin:0;font-size:11.6px;line-height:1.5;color:var(--ink-strong)}
#panel .pwhat .io-c.do p b{display:block;font-size:10.5px;color:var(--ink2);margin-bottom:2px}
#panel .pwhat .io.ai .io-c.do p b{color:var(--k-ai)}#panel .pwhat .io.hitl .io-c.do p b{color:var(--k-hitl)}
#panel .pwhat .io-c .none{margin:0;color:var(--ink3)}
#panel .pwhat .io-s{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;margin:0 0 9px}
#panel .pwhat .io-s .io-l{font-size:10px;font-weight:800;color:var(--ink3);margin:0 2px 0 6px}
#panel .pwhat .io-s .io-l:first-child{margin-left:0}
#panel .pwhat .io-s em{font-style:normal;font-size:10.5px;line-height:18px;padding:0 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink)}
#panel .pwhat .io-s em.f{background:var(--bg);border-style:dashed;color:var(--ink2)}
#panel .pwhat > p{font-size:12px;color:var(--ink2)}
@media (max-width:520px){#panel .pwhat .io{grid-template-columns:1fr}#panel .pwhat .io-a{transform:rotate(90deg);height:14px}}

/* 따라가기 중: 지도 아래쪽 박스도 설명 창 위로 올라오게 여유 공간 */
body.touring #inner{padding-bottom:380px}

/* ===== 흐름 따라가기 창 편집 ===== */
#tourcap .tc-edt{height:32px;padding:0 13px;border-radius:16px;border:1px dashed var(--ink3);background:#fff;font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer}
#tourcap .tc-edt:hover{border-color:var(--ink-strong);color:var(--ink-strong)}
#tourcap .tc-edt.on{background:var(--k-hitl);border:1px solid var(--k-hitl);color:#fff}
#tourcap.tc-editing{box-shadow:0 0 0 2px color-mix(in srgb,var(--k-hitl) 55%,transparent),0 28px 64px -24px rgba(15,23,42,.42)}
#tourcap .tce{outline:1.5px dashed color-mix(in srgb,var(--ink3) 70%,transparent);outline-offset:2px;border-radius:4px;cursor:text;transition:outline-color .15s,background .15s;min-width:1.2em;display:inline-block}
#tourcap .tce:hover{outline-color:var(--k-hitl);background:color-mix(in srgb,var(--k-hitl) 5%,#fff)}
#tourcap .tce:focus{outline:2px solid var(--k-hitl);background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--k-hitl) 15%,transparent)}
#tourcap .tce:empty::before{content:attr(data-ph);color:var(--ink3);font-weight:400}
#tourcap .tce-d{display:block;padding:2px 4px;margin-top:6px}
#tourcap .tce-t{padding:0 3px}
#tourcap .tc-steps li span .tce-v{display:inline;padding:0 2px}
#tourcap .tc-ctxe{line-height:2}
#tourcap .tc-ctxe .tce{display:inline;line-height:1.6;padding:0 2px}
#tourcap .tc-edbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--k-hitl) 7%,#fff);border:1px dashed color-mix(in srgb,var(--k-hitl) 45%,transparent);font-size:11px;color:var(--ink2)}
#tourcap .tc-edbar > b{color:var(--k-hitl);font-size:11.5px}
#tourcap .tc-edbar button{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line-strong);background:#fff;font-size:11px;cursor:pointer}
#tourcap .tc-edbar button:hover{border-color:var(--ink-strong)}
#tourcap .tc-edbar span{flex:1;min-width:220px;color:var(--ink3)}

#tourcap .tc-ctx span.tce{display:inline;background:transparent!important;color:var(--ink-strong)!important;font-size:11.5px!important;font-weight:400!important;line-height:1.7!important;padding:0 3px!important;margin:0!important;vertical-align:baseline!important;border-radius:4px}
#tourcap .tc-ctx span.tce:focus{background:#fff!important}
#tourcap .tc-steps li span .tce-v{display:inline-block;max-width:100%;padding:0 3px}

/* ===== 요약·범례: 접었다 펴기 (기본 접힘) ===== */
#infobox{margin:10px 0 4px}
#infobox .ib-h{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:8px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font:inherit;font-size:11.5px;color:var(--ink2);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
#infobox .ib-h:hover{border-color:var(--line-strong);background:color-mix(in srgb,var(--ink-strong) 3%,var(--surface))}
#infobox .ib-h b{font-size:11.5px;color:var(--ink-strong);white-space:nowrap}
#infobox .ib-ic{flex:none;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-style:italic;color:#fff;background:#94A3B8}
#infobox .ib-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3)}
#infobox .ib-sum i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 0 9px;vertical-align:0}
#infobox .ib-sum i.ai{background:var(--k-ai)}#infobox .ib-sum i.hitl{background:var(--k-hitl)}#infobox .ib-sum i.hu{background:var(--k-hu)}#infobox .ib-sum i.orc{background:var(--k-orc)}
#infobox .ib-tg{flex:none;font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
#infobox.ib-closed .ib-body{display:none}
#infobox:not(.ib-closed) .ib-h{border-radius:16px 16px 0 0;border-bottom:1px dashed var(--line)}
#infobox:not(.ib-closed) .ib-sum{visibility:hidden}
#infobox #summary{margin:0!important;border-radius:0!important;border-top:0!important}
#infobox .ib-body{animation:ibIn .22s ease both}
@keyframes ibIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 상세 창 '이 박스는': 하는 일 1~2줄을 먼저, 크게 */
#panel .pwhat > p.pdesc{font-size:13px;line-height:1.6;color:var(--ink-strong);font-weight:600;margin:4px 0 6px}
#panel .pwhat > p.ptb{font-size:11.8px;line-height:1.55;color:var(--ink2);margin:0 0 8px;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--k-ai) 5%,var(--surface));border-left:3px solid var(--k-ai)}

/* ===== Agent 구조도: 구조는 장표와 같게, 모양은 HTML 다른 화면과 같은 카드 톤 ===== */
#amap .amh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-right:44px}
#amap .amh .ax-pre{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line-strong);border-radius:999px;padding:3px 11px;background:var(--surface)}
#amap .ax{min-width:1180px;max-width:1560px;margin:12px auto 0;color:var(--ink)}
#amap .ax-chevs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px;margin-bottom:14px}
#amap .ax-ch{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm)}
#amap .ax-ch:not(:last-child)::after{content:'›';position:absolute;right:-14px;top:50%;transform:translateY(-52%);font-size:18px;font-weight:700;color:var(--ink3)}
#amap .ax-ch > i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--cream);color:var(--ink);font-style:normal;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
#amap .ax-ch small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
#amap .ax-ch b{display:block;font-size:13.5px;font-weight:700;color:var(--ink-strong);line-height:1.3}
#amap .ax-orc{position:relative;display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);margin:0 0 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s;color:var(--ink);min-height:0}
#amap .ax-orc:hover{border-color:var(--ink-strong);box-shadow:var(--sh-md);filter:none}
#amap .ax-on{flex:none;width:240px;display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:4px 10px;padding:12px 16px;margin:0;border-right:1px dashed var(--cream3);text-align:left;justify-content:flex-start}
#amap .ax-on b{font-size:14.5px;font-weight:800;color:var(--ink-strong);line-height:1.25}
#amap .ax-on small{display:block;font-size:10.5px;color:var(--ink3);width:100%;padding-left:34px}
#amap .ax-od{flex:1;padding:12px 18px;display:flex;flex-direction:column;justify-content:center;gap:7px}
#amap .ax-od p{margin:0;font-size:12.8px;line-height:1.55;color:var(--ink2)}
#amap .ax-od p b{display:inline-block;margin-right:8px;font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
#amap .ax-od span{display:inline-block;margin:0 4px 0 0;padding:3px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:11.5px;color:var(--ink);cursor:pointer;transition:all .15s}
#amap .ax-od span:hover{border-color:var(--red);color:var(--red);background:var(--surface)}
#amap .ax-od s{display:none}
#amap .ax-no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--cream);color:var(--ink);border:0;font-style:normal;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;position:static}
#amap .ax-orc .ax-no{background:var(--mk-bg);color:var(--mk-ink)}
#amap .ax-cols{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px}
#amap .ax-col{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);padding:12px;transition:border-color .15s,box-shadow .15s}
#amap .ax-col:hover{border-color:var(--cream3);box-shadow:var(--sh-md)}
#amap .ax-col header{position:static;display:flex;align-items:flex-start;justify-content:flex-start;gap:9px;cursor:pointer;padding:0 0 10px;border-bottom:1px dashed var(--cream3);min-height:46px;background:none;color:inherit;text-align:left}
#amap .ax-col header b{display:block;font-size:13.5px;font-weight:800;line-height:1.3;color:var(--ink-strong)}
#amap .ax-col header small{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:10.5px;color:var(--ink3);margin-top:3px}
#amap .ax-col header:hover b{color:var(--red)}
#amap .ax-col header:hover{filter:none}
#amap .ax-col:not(:last-child) header::after,#amap .ax-col header::after{display:none;content:none}
#amap .ax-col.lite header{background:none;color:inherit}
#amap .ax-note{position:static;display:inline-block;font-style:normal;font-size:10px;font-weight:700;color:var(--need-ink);background:var(--need-bg);border:1px dashed var(--need-bd);border-radius:999px;padding:1px 8px;white-space:nowrap}
#amap .ax-note::after{display:none;content:none}
#amap .ax-bul{list-style:none;margin:10px 0 0;padding:0;flex:1;min-height:132px}
#amap .ax-bul li{position:relative;padding-left:12px;margin:0 0 7px;font-size:12.3px;line-height:1.55;color:var(--ink2)}
#amap .ax-bul li::before{content:'';position:absolute;left:1px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--ink3)}
#amap .ax-sh{background:none;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink3);padding:9px 0 0;margin-top:4px;border-top:1px dashed var(--cream3)}
#amap .ax-sub{list-style:none;margin:7px 0 0;padding:0;min-height:112px;display:flex;flex-direction:column;gap:5px}
#amap .ax-sub li{padding:4px 10px;margin:0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:11.3px;line-height:1.4;color:var(--ink);cursor:pointer;transition:all .15s}
#amap .ax-sub li::before{display:none;content:none}
#amap .ax-sub li:hover{border-color:var(--red);color:var(--red);background:var(--surface);text-decoration:none}
#amap .ax-pc{margin-top:10px;padding-top:9px;border-top:1px dashed var(--cream3)}
#amap .ax-pc b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink3);margin-bottom:6px}
#amap .ax-pc span{display:flex;gap:4px}
#amap .ax-pc i{flex:1;max-width:22px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10.5px;font-weight:700;background:var(--cream);color:var(--ink3)}
#amap .ax-pc i.on{background:var(--red);color:#fff;box-shadow:0 1px 3px color-mix(in srgb,var(--red) 35%,transparent)}
#amap .amg{display:none}

/* Agent 한눈에 보기: 상세 페이지 폭 전체로 (이중 격자 때문에 왼쪽 칸에만 몰리던 문제) */
#apm .apovw{display:block;width:100%;margin:0;padding:0;border:0}
#apm .apovw > .apov{width:100%;box-sizing:border-box}
#apm .apovw .x4w{width:100%}

/* 카드 안 줄(머리 · 설명 · 세부 Agent 제목 · 목록 · Coverage)을 8개 카드가 같은 높이로 맞춤 */
@supports (grid-template-rows: subgrid){
  #amap .ax-cols{grid-template-rows:repeat(5,auto);row-gap:0}
  #amap .ax-col{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:0}
  #amap .ax-bul,#amap .ax-sub{min-height:0}
  #amap .ax-sub{align-content:start}
}

/* 구조도 Process Coverage: 단계 번호 + 그 단계 업무 수 (지도 기준) */
#amap .ax-pc b small{margin-left:6px;font-size:10px;font-weight:600;color:var(--ink3);letter-spacing:0}
#amap .ax-pc .ax-pn,#amap .ax-pc .ax-pv{display:flex;gap:4px}
#amap .ax-pc .ax-pn{margin-bottom:3px}
#amap .ax-pc .ax-pn i{flex:1;max-width:22px;height:auto;background:none;font-size:9.5px;font-weight:700;color:var(--ink3);border-radius:0;box-shadow:none}
#amap .ax-pc .ax-pv i{flex:1;max-width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;background:var(--cream);color:var(--ink3);box-shadow:none}
#amap .ax-pc .ax-pv i.on.l1{background:color-mix(in srgb,var(--red) 22%,var(--surface));color:var(--red)}
#amap .ax-pc .ax-pv i.on.l2{background:color-mix(in srgb,var(--red) 60%,var(--surface));color:#fff}
#amap .ax-pc .ax-pv i.on.l3{background:var(--red);color:#fff}
#amap .ax-sub li{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
#amap .ax-sub li em,#amap .ax-od span em{flex:none;font-style:normal;font-size:9.8px;font-weight:600;color:var(--ink3);white-space:nowrap}
#amap .ax-od span em{margin-left:6px}
#amap .ax-orc{flex-wrap:nowrap}
#amap .ax-ocov{flex:none;width:250px;padding:10px 16px;border-left:1px dashed var(--cream3);display:flex;align-items:center}
#amap .ax-ocov .ax-pc{margin:0;padding:0;border:0;width:100%}

#amap .ax-pc .ax-pch{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:6px;white-space:nowrap}
#amap .ax-pc .ax-pch b{display:inline;margin:0}
#amap .ax-pc .ax-pch small{font-size:10px;font-weight:600;color:var(--ink3)}

/* ===== AX 과제 × 제작 Agent 창 ===== */
#axw{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:20px 22px 40px}
#axw .amh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-right:44px;max-width:1560px;margin:0 auto}
#axw .amh b{font-size:18px;color:var(--ink-strong)}
#axw .amh span{font-size:12px;color:var(--ink2)}
#axw .amh .ax-pre{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line-strong);border-radius:999px;padding:3px 11px;background:var(--surface)}
#axw .px{position:absolute;right:12px;top:10px;border:0;background:var(--cream);font-size:16px;line-height:1;padding:5px 9px;border-radius:999px;cursor:pointer}
#axw .px:hover{background:var(--cream2)}
#axw .axw-in{max-width:1560px;margin:12px auto 0}
#axw .ax-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
#axw .ax-kpi button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);cursor:pointer;font:inherit;color:var(--ink);transition:all .15s}
#axw .ax-kpi button:hover{box-shadow:var(--sh-md)}
#axw .ax-kpi button[aria-pressed="true"]{border-color:var(--ink-strong);box-shadow:0 0 0 1px var(--ink-strong)}
#axw .ax-kpi b{font-size:26px;font-weight:800;line-height:1.1;color:var(--ink-strong)}
#axw .ax-kpi .k-D b{color:var(--red)}
#axw .ax-kpi span{font-size:13px;font-weight:700}
#axw .ax-kpi small{font-size:11px;color:var(--ink3)}
#axw .ax-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm)}
#axw .ax-ctl .seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
#axw .ax-ctl .seg button,#axw .ax-bands button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--ink2);padding:5px 12px;border-radius:999px;cursor:pointer}
#axw .ax-ctl .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink-strong);box-shadow:0 1px 3px rgba(8,15,52,.12)}
#axw .ax-bands{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
#axw .ax-bands span{font-size:11px;font-weight:700;color:var(--ink3);margin-right:4px}
#axw .ax-bands button{border:1px solid var(--line);background:var(--bg);font-size:11.5px;padding:4px 10px}
#axw .ax-bands button[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:var(--surface)}
#axw #axq{margin-left:auto;min-width:220px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:999px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink)}
#axw .ax-note{font-size:11px;color:var(--ink3);margin:8px 4px 4px}
#axw .ax-g{margin-top:16px}
#axw .ax-g h3{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-strong);margin:0 0 10px}
#axw .ax-g h3 i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
#axw .ax-g h3 i.o{background:var(--cream);color:var(--ink)}
#axw .ax-g h3 small{font-size:11.5px;font-weight:600;color:var(--ink3)}
#axw .ax-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
#axw .ax-t{position:relative;display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);padding:12px 14px 10px;transition:box-shadow .15s,border-color .15s}
#axw .ax-t:hover{box-shadow:var(--sh-md)}
#axw .ax-t.lv-D{box-shadow:inset 3px 0 0 var(--red),var(--sh-sm)}

/* ===== AX 과제 커버리지 맵: ① 프로세스 → ② 과제 → ③ Agent ===== */

#axw .axm{display:grid;grid-template-columns:150px repeat(7,minmax(0,1fr)) repeat(3,minmax(0,1fr)) minmax(0,1.45fr);column-gap:6px;row-gap:0;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);padding:10px 12px 12px;min-width:1240px}

#axw .axm-gh.adj{color:var(--ink2);border-color:var(--cream3)}
#axw .axm-lab{display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px;padding:12px 4px 6px}
#axw .axm-lab i{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;background:var(--cream);color:var(--ink)}
#axw .axm-lab.l3 i{background:var(--red);color:#fff}

#axw .axm-lab small{flex-basis:100%;font-size:10px;color:var(--ink3);padding-left:29px}
#axw .l3h{border-top:0}
#axw .axm-ag{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;margin:3px 0;padding:3px 8px;border:1px solid transparent;border-radius:8px;background:none;font:inherit;text-align:left;cursor:pointer;min-height:30px}

#axw .axm-ag:hover,#axw .axm-ag.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 5%,var(--surface))}

#axw .axm-seg{margin:3px 0;min-height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;background:repeating-linear-gradient(90deg,transparent 0 6px,color-mix(in srgb,var(--line) 70%,transparent) 6px 7px);background-size:100% 1px;background-repeat:no-repeat;background-position:center}

#axw .axm-t{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 7px;font:inherit;font-size:10.6px;line-height:1.38;color:var(--ink);cursor:pointer;transition:all .12s}

/* 프로세스 층을 화면 바닥에 고정 (과제를 내려 봐도 어느 단계인지 보이게) */
#axw .axm-pr,#axw .axm-lab.l1{position:sticky;bottom:6px;z-index:5}
#axw .axm-lab.l1{background:var(--surface);border-radius:10px}
#axw .axm-pr{box-shadow:0 -6px 16px -8px rgba(8,15,52,.18),var(--sh-sm)}
#axw .axm-pr.adj{background:color-mix(in srgb,var(--cream) 70%,var(--surface))}
#axw .axm-more{width:100%;border:1px dashed var(--line-strong);background:var(--surface);border-radius:8px;padding:4px 6px;font:inherit;font-size:10.5px;font-weight:700;color:var(--ink3);cursor:pointer}

/* 바닥 층 사이 틈을 흰 띠로 메워 뒤 과제 칩이 비치지 않게 */
#axw .axm-pr,#axw .axm-lab.l1{bottom:0;box-shadow:0 0 0 5px var(--surface),0 -14px 18px -8px rgba(8,15,52,.22)}

/* 바닥 층이 화면 맨 아래에 붙도록: 창 아래 여백은 내용 쪽으로 */
#axw{padding-bottom:0}
#axw .axw-in{padding-bottom:40px}
#axw .axm-pr,#axw .axm-lab.l1{box-shadow:0 0 0 5px var(--surface),0 12px 0 5px var(--surface),0 -14px 18px -8px rgba(8,15,52,.22)}

/* ===== AX 과제 창 Agent 과제 Coverage 표 · 조직별 ===== */
#axw .ax-ctl{gap:10px 14px}
#axw .axx-wrap{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);padding:8px 10px 10px;overflow-x:auto}
#axw table.axx{width:100%;min-width:1180px;border-collapse:separate;border-spacing:4px 4px;table-layout:fixed}

#axw table.axx col.c0{width:200px}

#axw table.axx td .nb b{font-size:17px;font-weight:800;line-height:1.1}

#axw table.axx td .nb.d{background:color-mix(in srgb,var(--red) calc(var(--a,1) * 100%),var(--surface));color:#fff}
#axw table.axx td .nb.p{background:color-mix(in srgb,var(--red) 18%,var(--surface));color:var(--red)}

#axw table.axx td .nz{display:block;min-height:44px;line-height:44px;color:var(--line-strong);background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 55%,transparent) 6px 7px);border-radius:10px}

#axw table.axx tfoot th.ft{font-size:10.5px;font-weight:800;color:var(--ink3);text-align:right;padding:4px 10px}

#axw table.axx .tot b{font-size:13px;color:var(--ink-strong)}#axw table.axx .tot small{font-size:10px;color:var(--ink3)}

#axw .ax-ag.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--surface));color:var(--red)}

#axw .axo-top{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:12px}
